[project]
name = "tool-scout"
version = "0.1.0"
description = "Daily crawler + public catalog + on-demand wrapper generator for Claude-compatible tools"
authors = [{ name = "Majied" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["claude-code", "mcp", "crawler", "catalog", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # CLI + UX
    "typer>=0.12.0",
    "rich>=13.7.0",

    # HTTP + parsing
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12.0",

    # Data + DB
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",

    # Google Sheets
    "gspread>=6.1.0",
    "gspread-formatting>=1.1.2",
    "google-auth>=2.29.0",

    # Git automation
    "gitpython>=3.1.43",

    # Webhook + queue worker (FastAPI for receiver, uvicorn to host it)
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # Symphony orchestrator essentials
    "python-liquid>=1.12.1",          # strict-undefined template engine for WORKFLOW.md prompt
    "watchdog>=4.0.0",                # filesystem watch for WORKFLOW.md hot reload

    # Misc
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.0",
]

[project.scripts]
scout = "tool_scout.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_scout"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "ASYNC"]
ignore = ["E501"]   # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]
