[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# SQLite DB URL is overridden at runtime by migrations/env.py via Path.home(),
# which correctly handles Windows usernames containing spaces. The value here is
# a placeholder so ConfigParser doesn't choke; do not edit it.
sqlalchemy.url = sqlite:///placeholder.db

[post_write_hooks]
# Auto-format new migration files with ruff
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
