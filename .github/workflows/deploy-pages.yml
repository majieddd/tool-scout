name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  # Re-deploy after a successful daily-crawl. The bot's push uses
  # GITHUB_TOKEN, which by design does NOT trigger downstream `push`
  # workflows (loop protection). workflow_run fires on the upstream
  # workflow's completion event regardless of pusher.
  workflow_run:
    workflows: ["Daily crawl + export"]
    types: [completed]
    branches: [main]

# Single in-flight deployment; cancel obsolete builds.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if dispatched-via-workflow_run reports the upstream as failed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build static export
        env:
          DEPLOY_TARGET: github-pages
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
